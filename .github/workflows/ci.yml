name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://dmarcscope:dmarcscope@localhost:5432/dmarcscope

jobs:
  web:
    name: Web app (typecheck, tests, build, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmarcscope
          POSTGRES_PASSWORD: dmarcscope
          POSTGRES_DB: dmarcscope
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dmarcscope" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Unit and database tests
        run: npm test
      - run: npm run build
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      # A second, empty database for the first-run test: the app started with
      # only the three required variables must serve the setup wizard.
      - name: Fresh database for the first-run test
        run: |
          node -e "const pg=require('pg');const c=new pg.Client(process.env.TEST_DATABASE_URL);c.connect().then(()=>c.query('CREATE DATABASE dmarcscope_setup')).then(()=>c.end())"
          DATABASE_URL="${TEST_DATABASE_URL%/*}/dmarcscope_setup" npm run db:migrate
      - name: End-to-end sign-in tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          AUTH_PROVIDER: oidc
          OIDC_ISSUER: http://127.0.0.1:9911
          OIDC_ALLOW_INSECURE_ISSUER: 'true'
          OIDC_CLIENT_ID: dmarcscope
          OIDC_CLIENT_SECRET: e2e-client-secret
          SESSION_SECRET: ci-only-session-secret-0123456789-abcdef
          CRON_SECRET: ci-only-cron-secret-0123456789
          APP_URL: http://127.0.0.1:3101
          ADMIN_EMAILS: admin@example.com
          ALLOWED_GROUPS: dmarc-viewers
          PORT: 3101
          HOSTNAME: 127.0.0.1
          E2E_BASE_URL: http://127.0.0.1:3101
          E2E_CRON_SECRET: ci-only-cron-secret-0123456789
          E2E_SETUP_BASE_URL: http://127.0.0.1:3102
          E2E_SETUP_LOG: ${{ runner.temp }}/setup-server.log
          E2E_SETUP_APP_SECRET: ci-only-app-secret-for-first-run-0123456789
        run: |
          cp -R .next/static .next/standalone/.next/static
          node .next/standalone/server.js &
          # First run: nothing but DATABASE_URL, APP_URL and APP_SECRET (and
          # where to listen). env -i drops everything this job set above.
          env -i PATH="$PATH" HOME="$HOME" \
            DATABASE_URL="${TEST_DATABASE_URL%/*}/dmarcscope_setup" \
            APP_URL=http://127.0.0.1:3102 APP_SECRET="$E2E_SETUP_APP_SECRET" \
            PORT=3102 HOSTNAME=127.0.0.1 \
            node .next/standalone/server.js > "$E2E_SETUP_LOG" 2>&1 &
          for i in $(seq 1 30); do curl -sf "$E2E_BASE_URL/api/healthz" >/dev/null && curl -sf "$E2E_SETUP_BASE_URL/api/healthz" >/dev/null && break; sleep 1; done
          npm run test:e2e

  ingest:
    name: Ingest worker (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmarcscope
          POSTGRES_PASSWORD: dmarcscope
          POSTGRES_DB: dmarcscope
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dmarcscope" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest ingestor -q

  images:
    name: Container images and the README quick start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t dmarcscope .
      - run: docker build -f Dockerfile.ingest -t dmarcscope-ingest .
      - name: Ingest image starts
        run: docker run --rm dmarcscope-ingest --version
      - name: Ingest image can decrypt secrets saved by the web app
        run: docker run --rm --entrypoint python dmarcscope-ingest -c "from ingestor.crypto import decrypt, encrypt; s='x'*32; assert decrypt(secrets=[s], purpose='setting', context='k', envelope=encrypt(secret=s, purpose='setting', context='k', plaintext='ok')).plaintext == 'ok'"
      - name: Ingest image refuses serve mode without APP_SECRET
        run: |
          code=0; docker run --rm -e DATABASE_URL=postgresql://x:y@127.0.0.1:1/z dmarcscope-ingest serve || code=$?
          test "$code" = 2
      - name: Web image ships its command-line scripts
        run: |
          # Without DATABASE_URL each exits 2 (configuration error) once its
          # imports have loaded; a missing file would exit 1.
          for script in migrate settings-import secrets-reencrypt; do
            code=0; docker run --rm dmarcscope node "scripts/$script.mjs" || code=$?
            echo "$script: $code"
            if [ "$script" = migrate ]; then test "$code" = 1; else test "$code" = 2; fi
          done
      - name: Images run as a numeric non-root user (Kubernetes runAsNonRoot)
        run: |
          test "$(docker inspect -f '{{.Config.User}}' dmarcscope)" = "1000:1000"
          test "$(docker inspect -f '{{.Config.User}}' dmarcscope-ingest)" = "10001:10001"
      # The exact commands from "Try it in five minutes" in README.md.
      - name: Quick start
        run: |
          cp .env.example .env
          echo 'AUTH_ALLOW_INSECURE_NONE=true' >> .env
          python3 scripts/demo_reports.py demo-reports
          docker compose up -d --build
          docker compose run --rm ingest import /reports
      - name: Settings import runs in the web image (dry run)
        run: docker compose run --rm --no-deps web node scripts/settings-import.mjs --dry-run
      - name: Dashboard serves the imported data
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/readyz >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/api/readyz
          curl -sf http://127.0.0.1:3000/ | grep -q 'example.com'
          curl -sf 'http://127.0.0.1:3000/issues?range=all' | grep -q 'failing messages'
      - name: A PORT in .env does not break the published port
        run: |
          echo 'PORT=8080' >> .env
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/healthz >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/api/healthz
      # The worker for mailboxes set up in the panel: starts under its compose
      # profile, reports in, and stops cleanly on docker compose stop.
      - name: Serve-mode worker under its compose profile
        run: |
          echo "APP_SECRET=ci-only-app-secret-0123456789-abcdefghijkl" >> .env
          docker compose --profile serve up -d worker
          for i in $(seq 1 30); do
            n=$(docker compose exec -T db psql -U dmarcscope -d dmarcscope -Atc 'SELECT COUNT(*) FROM worker_heartbeats')
            [ "$n" = 1 ] && break; sleep 2
          done
          test "$n" = 1
          docker compose --profile serve stop worker
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose --profile serve ps -aq worker)")" = 0
          test "$(docker compose exec -T db psql -U dmarcscope -d dmarcscope -Atc 'SELECT COUNT(*) FROM worker_heartbeats')" = 0
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color | tail -200
