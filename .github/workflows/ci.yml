name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://dmarcscope:dmarcscope@localhost:5432/dmarcscope

jobs:
  web:
    name: Web app (typecheck, tests, build, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmarcscope
          POSTGRES_PASSWORD: dmarcscope
          POSTGRES_DB: dmarcscope
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dmarcscope" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Unit and database tests
        run: npm test
      - run: npm run build
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: End-to-end sign-in tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          AUTH_PROVIDER: oidc
          OIDC_ISSUER: http://127.0.0.1:9911
          OIDC_ALLOW_INSECURE_ISSUER: 'true'
          OIDC_CLIENT_ID: dmarcscope
          OIDC_CLIENT_SECRET: e2e-client-secret
          SESSION_SECRET: ci-only-session-secret-0123456789-abcdef
          CRON_SECRET: ci-only-cron-secret-0123456789
          APP_URL: http://127.0.0.1:3101
          ADMIN_EMAILS: admin@example.com
          ALLOWED_GROUPS: dmarc-viewers
          PORT: 3101
          HOSTNAME: 127.0.0.1
          E2E_BASE_URL: http://127.0.0.1:3101
          E2E_CRON_SECRET: ci-only-cron-secret-0123456789
        run: |
          cp -R .next/static .next/standalone/.next/static
          node .next/standalone/server.js &
          for i in $(seq 1 30); do curl -sf "$E2E_BASE_URL/api/healthz" >/dev/null && break; sleep 1; done
          npm run test:e2e

  ingest:
    name: Ingest worker (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmarcscope
          POSTGRES_PASSWORD: dmarcscope
          POSTGRES_DB: dmarcscope
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dmarcscope" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest ingestor -q

  images:
    name: Container images and the README quick start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dmarcscope .
      - run: docker build -f Dockerfile.ingest -t dmarcscope-ingest .
      - name: Ingest image starts
        run: docker run --rm dmarcscope-ingest --version
      - name: Images run as a numeric non-root user (Kubernetes runAsNonRoot)
        run: |
          test "$(docker inspect -f '{{.Config.User}}' dmarcscope)" = "1000:1000"
          test "$(docker inspect -f '{{.Config.User}}' dmarcscope-ingest)" = "10001:10001"
      # The exact commands from "Try it in five minutes" in README.md.
      - name: Quick start
        run: |
          cp .env.example .env
          echo 'AUTH_ALLOW_INSECURE_NONE=true' >> .env
          python3 scripts/demo_reports.py demo-reports
          docker compose up -d --build
          docker compose run --rm ingest import /reports
      - name: Dashboard serves the imported data
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/readyz >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/api/readyz
          curl -sf http://127.0.0.1:3000/ | grep -q 'example.com'
          curl -sf 'http://127.0.0.1:3000/issues?range=all' | grep -q 'failing messages'
      - name: A PORT in .env does not break the published port
        run: |
          echo 'PORT=8080' >> .env
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/healthz >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/api/healthz
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color | tail -200
